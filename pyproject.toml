[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabpilot-mcp"
version = "0.1.1"
description = "MCP server that reads and drives a real, logged-in Chrome — cross-platform, Ubuntu-headless first-class."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Le Phuoc Hung" }]
keywords = [
  "mcp", "mcp-server", "model-context-protocol", "chrome",
  "cdp", "browser-automation", "claude-desktop", "cursor-mcp",
  "ai-agents", "testing", "headless", "web-automation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Testing",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
tabpilot = "tabpilot.cli:main"
tabpilot-mcp = "tabpilot.cli:main_serve"

[project.urls]
Homepage = "https://github.com/hunglp97/tabpilot-mcp"
Repository = "https://github.com/hunglp97/tabpilot-mcp"
Issues = "https://github.com/hunglp97/tabpilot-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real Chrome with an open CDP port"]
