name: 💡 Feature Request
description: Suggest an idea or enhancement for TabPilot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make TabPilot more capable or token-efficient? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific problem or web application pattern?
      placeholder: I am trying to automate a web page where...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
